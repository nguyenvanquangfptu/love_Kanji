# Security headers for the pages and static files nginx serves itself (not for /api/: Spring Security sets its own).
# Included from each location in nginx.conf: a location that has any add_header of its own does not inherit the
# ones written at server level, so they cannot simply go there.
#
# CSP: everything comes from this origin except the Google Fonts stylesheet and its font files (index.html).
# React sets inline styles through the DOM (element.style), which style-src does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
