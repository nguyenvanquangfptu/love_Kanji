server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file tĩnh đều trả về index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API sang service backend trong cùng docker network - tránh CORS
    # vì Frontend và Backend cùng chung origin từ góc nhìn của trình duyệt.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè, không nối thêm: giá trị X-Forwarded-For do client tự gửi bị bỏ, backend chỉ nhận IP
        # nginx thấy được - nên không thể giả IP để vượt giới hạn đăng nhập.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
